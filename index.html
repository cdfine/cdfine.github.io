<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carli's Website</title>
    <script>
      try {
        const root = document.documentElement
        const theme = localStorage.getItem('theme')
        if (theme) {
          root.dataset.theme = theme
          root.dataset.mode = localStorage.getItem('theme-mode') ?? 'light'
        } else {
          // Must match systemThemes in src/config/themes.ts
          const isDark = matchMedia('(prefers-color-scheme: dark)').matches
          root.dataset.theme = isDark ? 'pink-pony-club' : 'midwest-princess'
          root.dataset.mode = isDark ? 'dark' : 'light'
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
