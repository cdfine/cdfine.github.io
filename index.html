<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carli's Website</title>
    <script>
      try {
        const root = document.documentElement
        const theme = localStorage.getItem('theme') ?? 'system'
        if (theme === 'system') {
          const mode = matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light'
          root.dataset.theme = root.dataset.mode = mode
        } else {
          root.dataset.theme = theme
          root.dataset.mode = localStorage.getItem('theme-mode') ?? 'light'
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
